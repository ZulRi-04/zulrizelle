<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulri - Acceso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .logos-wrapper { display: flex; justify-content: center; align-items: center; gap: 3rem; margin-bottom: 2rem; }
        .logos-wrapper img { height: 70px; width: auto; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15)); transition: transform 0.3s ease; }
        .logos-wrapper img:hover { transform: scale(1.05); }
        .container { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); width: 100%; max-width: 400px; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        h2 { text-align: center; color: #1f2937; margin-bottom: 1.5rem; font-size: 1.5rem; font-weight: 700; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; color: #374151; font-size: 0.9rem; font-weight: 500; }
        .input-wrapper { position: relative; }
        input { width: 100%; padding: 0.75rem 1rem; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1rem; transition: all 0.2s; outline: none; }
        input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15); }
        .password-input { padding-right: 3rem; }
        .toggle-password { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; width: 20px; height: 20px; opacity: 0.6; transition: opacity 0.2s; }
        .toggle-password:hover { opacity: 1; }
        button { width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: transform 0.2s, box-shadow 0.2s; }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #message { text-align: center; margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; font-weight: 500; }
        .error { color: #dc2626; }
        .success { color: #16a34a; }
        .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="logos-wrapper">
        <img src="logo.png" alt="Zulri Supermarket">
        <img src="Zelle_logo.svg.webp" alt="Zelle">
    </div>

    <div class="container">
        <h2>Iniciar sesión</h2>
        
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="tu usuario" autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="password" class="password-input" placeholder="Tu contraseña" autocomplete="current-password">
                <svg class="toggle-password" id="toggle-password" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </div>
        </div>
        
        <button id="login-btn">Entrar</button>
        
        <p id="message"></p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBveW42iYdCHka8Q_pFlHTR2E6ou7DTek0",
        authDomain: "zulri-1c741.firebaseapp.com",
        databaseURL: "https://zulri-1c741-default-rtdb.firebaseio.com",
        projectId: "zulri-1c741",
        storageBucket: "zulri-1c741.firebasestorage.app",
        messagingSenderId: "694828053364",
        appId: "1:694828053364:web:b617344a0cfaefc954f221"
    };

    const ADMIN_EMAIL = "richard@zulri.local";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginBtn = document.getElementById('login-btn');
    const message = document.getElementById('message');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('toggle-password');

    togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        if (type === 'text') {
            togglePassword.innerHTML = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            `;
        } else {
            togglePassword.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
        }
    });

    loginBtn.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            mostrarMensaje("Por favor, completa todos los campos.", "error");
            return;
        }

        const email = username.toLowerCase() + "@zulri.local";

        loginBtn.disabled = true;
        const textoOriginal = loginBtn.textContent;
        loginBtn.innerHTML = '<span class="loader"></span>Entrando...';
        mostrarMensaje("", "");

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Verificar si el usuario está activo (excepto el admin)
            if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                const userSnapshot = await get(ref(db, 'usuarios/' + user.uid));
                if (userSnapshot.exists()) {
                    const userData = userSnapshot.val();
                    if (userData.activo === false) {
                        await signOut(auth);
                        mostrarMensaje("Esta cuenta ha sido desactivada. Contacta al administrador.", "error");
                        loginBtn.disabled = false;
                        loginBtn.textContent = textoOriginal;
                        return;
                    }
                }
            }

            // Redirigir según el rol
            if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                mostrarMensaje("¡Bienvenido, Administrador!", "success");
                setTimeout(() => {
                    window.location.href = "dashboard-admin.html";
                }, 1000);
            } else {
                mostrarMensaje("¡Bienvenido!", "success");
                setTimeout(() => {
                    window.location.href = "dashboard-usuario.html";
                }, 1000);
            }
            
        } catch (error) {
            console.error("Error de Firebase:", error);
            mostrarMensaje(traducirError(error.code), "error");
            loginBtn.disabled = false;
            loginBtn.textContent = textoOriginal;
        }
    });

    function mostrarMensaje(texto, tipo) {
        message.textContent = texto;
        message.className = tipo || "";
    }

    function traducirError(codigo) {
        const errores = {
            'auth/invalid-email': 'El usuario no tiene un formato válido.',
            'auth/user-disabled': 'Esta cuenta ha sido deshabilitada.',
            'auth/user-not-found': 'No existe una cuenta con este usuario.',
            'auth/wrong-password': 'Contraseña incorrecta.',
            'auth/invalid-credential': 'Usuario o contraseña incorrectos.',
            'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde.',
            'auth/network-request-failed': 'Error de conexión. Revisa tu internet.'
        };
        return errores[codigo] || 'Ocurrió un error. Inténtalo de nuevo.';
    }
</script>

</body>
</html>
