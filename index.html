<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulri - Acceso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column; /* Apila los elementos verticalmente */
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== LOGOS FUERA DEL RECUADRO ===== */
        .logos-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3rem; /* Espacio entre los dos logos */
            margin-bottom: 2rem;
        }

        .logos-wrapper img {
            height: 70px; /* Tamaño grande */
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15)); /* Sombra sutil para que resalten */
            transition: transform 0.3s ease;
        }

        .logos-wrapper img:hover {
            transform: scale(1.05);
        }

        /* ===== RECUADRO BLANCO ===== */
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #374151;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            min-height: 1.2em;
            font-weight: 500;
        }

        .error { color: #dc2626; }
        .success { color: #16a34a; }

        .loader {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- LOGOS FUERA DEL RECUADRO BLANCO -->
    <div class="logos-wrapper">
        <img src="logo.png" alt="Zulri Supermarket">
        <img src="Zelle_logo.svg" alt="Zelle">
    </div>

    <!-- RECUADRO BLANCO SOLO CON EL FORMULARIO -->
    <div class="container">
        <h2>Iniciar sesión</h2>
        
        <div class="form-group">
            <label for="email">Usuario</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
        </div>
        
        <button id="login-btn">Entrar</button>
        
        <p id="message"></p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBveW42iYdCHka8Q_pFlHTR2E6ou7DTek0",
        authDomain: "zulri-1c741.firebaseapp.com",
        databaseURL: "https://zulri-1c741-default-rtdb.firebaseio.com",
        projectId: "zulri-1c741",
        storageBucket: "zulri-1c741.firebasestorage.app",
        messagingSenderId: "694828053364",
        appId: "1:694828053364:web:b617344a0cfaefc954f221"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById('login-btn');
    const message = document.getElementById('message');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    loginBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            mostrarMensaje("Por favor, completa todos los campos.", "error");
            return;
        }

        loginBtn.disabled = true;
        const textoOriginal = loginBtn.textContent;
        loginBtn.innerHTML = '<span class="loader"></span>Entrando...';
        mostrarMensaje("", "");

        try {
            await signInWithEmailAndPassword(auth, email, password);
            mostrarMensaje("¡Bienvenido, Richard!", "success");
            
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);
            
        } catch (error) {
            console.error("Error de Firebase:", error);
            mostrarMensaje(traducirError(error.code), "error");
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = textoOriginal;
        }
    });

    function mostrarMensaje(texto, tipo) {
        message.textContent = texto;
        message.className = tipo || "";
    }

    function traducirError(codigo) {
        const errores = {
            'auth/invalid-email': 'El usuario no tiene un formato válido de correo.',
            'auth/user-disabled': 'Esta cuenta ha sido deshabilitada.',
            'auth/user-not-found': 'No existe una cuenta con este usuario.',
            'auth/wrong-password': 'Contraseña incorrecta.',
            'auth/invalid-credential': 'Usuario o contraseña incorrectos.',
            'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde.',
            'auth/network-request-failed': 'Error de conexión. Revisa tu internet.'
        };
        return errores[codigo] || 'Ocurrió un error. Inténtalo de nuevo.';
    }
</script>

</body>
</html>
