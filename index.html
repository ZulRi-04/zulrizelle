<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso - Web App Global</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px;
        }

        .card { 
            background: white; 
            width: 100%; 
            max-width: 100%;
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            overflow: hidden;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #007bff;
            border-bottom: 3px solid #007bff;
            margin-bottom: -2px;
        }

        .form-container {
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 38px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            transition: color 0.3s;
        }
        .toggle-password:hover {
            color: #007bff;
        }
        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        .row {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button.btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button.btn-primary:hover { background-color: #0056b3; }
        button.btn-primary:disabled { background-color: #a0cfff; cursor: not-allowed; }

        /* Botón de Google */
        .btn-google {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-google:hover {
            background-color: #f8f9fa;
            border-color: #bbb;
        }
        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 14px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        .divider span {
            padding: 0 10px;
        }

        .link-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            width: 100%;
        }
        .link-btn:hover { color: #0056b3; }

        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .hidden { display: none !important; }

        @media (min-width: 768px) {
            body { padding: 0; }
            .card { max-width: 450px; }
            .form-container { padding: 30px; }
            .row {
                flex-direction: row;
            }
            .row .input-group {
                flex: 1;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarPestana('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="cambiarPestana('registro')">Crear Cuenta</button>
        </div>

        <div class="form-container">
            <!-- FORMULARIO DE LOGIN -->
            <div id="form-login">
                <h2>Bienvenido de nuevo</h2>
                
                <button class="btn-google" onclick="iniciarConGoogle()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continuar con Google
                </button>

                <div class="divider">
                    <span>o</span>
                </div>

                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="login-email" placeholder="tu@correo.com">
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <button class="btn-primary" onclick="iniciarSesion()">Entrar</button>
                <button class="link-btn" onclick="mostrarRecuperar()">¿Olvidaste tu contraseña?</button>
            </div>

            <!-- FORMULARIO DE RECUPERAR CONTRASEÑA -->
            <div id="form-recuperar" class="hidden">
                <h2>Recuperar Cuenta</h2>
                <p style="text-align: center; color: #666; margin-bottom: 20px; font-size: 14px;">
                    Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
                </p>
                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="recuperar-email" placeholder="tu@correo.com">
                </div>
                <button class="btn-primary" onclick="recuperarCuenta()">Enviar Enlace</button>
                <button class="link-btn" onclick="cambiarPestana('login')">← Volver al inicio de sesión</button>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <div id="form-registro" class="hidden">
                <h2>Crea tu cuenta</h2>
                
                <button class="btn-google" onclick="iniciarConGoogle()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Registrarse con Google
                </button>

                <div class="divider">
                    <span>o</span>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Nombre</label>
                        <input type="text" id="reg-nombre" placeholder="Tu nombre">
                    </div>
                    <div class="input-group">
                        <label>Apellido</label>
                        <input type="text" id="reg-apellido" placeholder="Tu apellido">
                    </div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label>Correo electrónico (Gmail)</label>
                    <input type="email" id="reg-email" placeholder="tu@gmail.com">
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres">
                    <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="input-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="reg-confirm" placeholder="Repite la contraseña">
                    <button type="button" class="toggle-password" onclick="togglePassword('reg-confirm', this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <button class="btn-primary" onclick="registrarse()">Crear Cuenta</button>
            </div>

            <p id="mensaje"></p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBveW42iYdCHka8Q_pFlHTR2E6ou7DTek0",
            authDomain: "zulri-1c741.firebaseapp.com",
            databaseURL: "https://zulri-1c741-default-rtdb.firebaseio.com",
            projectId: "zulri-1c741",
            storageBucket: "zulri-1c741.firebasestorage.app",
            messagingSenderId: "694828053364",
            appId: "1:694828053364:web:b617344a0cfaefc954f221"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const mensaje = document.getElementById('mensaje');
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        auth.onAuthStateChanged((user) => {
            if (user && user.emailVerified) {
                window.location.href = "dashboard.html";
            }
        });

        function cambiarPestana(tipo) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-registro').classList.add('hidden');
            document.getElementById('form-recuperar').classList.add('hidden');

            if (tipo === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('form-login').classList.remove('hidden');
            } else if (tipo === 'registro') {
                tabs[1].classList.add('active');
                document.getElementById('form-registro').classList.remove('hidden');
            }
            mensaje.innerText = "";
        }

        function mostrarRecuperar() {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-recuperar').classList.remove('hidden');
            mensaje.innerText = "";
        }

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const eyeOpen = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>`;
            const eyeClosed = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>`;

            if (input.type === "password") {
                input.type = "text";
                button.innerHTML = eyeClosed;
            } else {
                input.type = "password";
                button.innerHTML = eyeOpen;
            }
        }

        // INICIAR SESIÓN CON GOOGLE
        function iniciarConGoogle() {
            mostrarMensaje("Conectando con Google...", "blue");

            auth.signInWithPopup(googleProvider)
                .then((result) => {
                    const user = result.user;
                    
                    // Verificar si el usuario ya existe en la base de datos
                    return db.ref('usuarios/' + user.uid).once('value').then((snapshot) => {
                        if (!snapshot.exists()) {
                            // Usuario nuevo, guardar datos de Google
                            const nombreCompleto = user.displayName || "";
                            const partes = nombreCompleto.split(' ');
                            const nombre = partes[0] || "Usuario";
                            const apellido = partes.slice(1).join(' ') || "";

                            return db.ref('usuarios/' + user.uid).set({
                                nombre: nombre,
                                apellido: apellido,
                                email: user.email,
                                fechaRegistro: new Date().toISOString(),
                                metodoRegistro: 'google'
                            });
                        }
                    });
                })
                .then(() => {
                    mostrarMensaje("¡Inicio de sesión exitoso! Redirigiendo...", "green");
                })
                .catch((error) => {
                    mostrarMensaje("Error: " + error.message, "red");
                });
        }

        // INICIAR SESIÓN CON EMAIL
        function iniciarSesion() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            mostrarMensaje("Procesando...", "blue");

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    if (!user.emailVerified) {
                        auth.signOut();
                        mostrarMensaje("Debes verificar tu correo. Revisa tu bandeja de entrada.", "orange");
                        setTimeout(() => {
                            if(confirm("¿Quieres que reenviemos el correo de verificación?")) {
                                reenviarVerificacion(user);
                            }
                        }, 500);
                    } else {
                        mostrarMensaje("¡Inicio de sesión exitoso! Redirigiendo...", "green");
                    }
                })
                .catch((error) => mostrarMensaje("Error: " + traducirError(error.code), "red"));
        }

        // REGISTRARSE CON EMAIL
        function registrarse() {
            const nombre = document.getElementById('reg-nombre').value.trim();
            const apellido = document.getElementById('reg-apellido').value.trim();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (!email.toLowerCase().endsWith('@gmail.com')) {
                return mostrarMensaje("Por favor, usa una cuenta de Gmail.", "red");
            }

            if (!nombre || !apellido) return mostrarMensaje("Por favor, ingresa tu nombre y apellido.", "red");
            if (password.length < 6) return mostrarMensaje("La contraseña debe tener al menos 6 caracteres.", "red");
            if (password !== confirm) return mostrarMensaje("Las contraseñas no coinciden.", "red");

            mostrarMensaje("Creando cuenta...", "blue");

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    return db.ref('usuarios/' + user.uid).set({
                        nombre: nombre,
                        apellido: apellido,
                        email: email,
                        fechaRegistro: new Date().toISOString(),
                        metodoRegistro: 'email'
                    }).then(() => {
                        return user.sendEmailVerification();
                    });
                })
                .then(() => {
                    mostrarMensaje("¡Cuenta creada! Revisa tu correo de Gmail para verificarla.", "green");
                    document.querySelectorAll('#form-registro input').forEach(input => input.value = "");
                })
                .catch((error) => {
                    mostrarMensaje("Error: " + traducirError(error.code), "red");
                });
        }

        function recuperarCuenta() {
            const email = document.getElementById('recuperar-email').value;
            if (!email) return mostrarMensaje("Ingresa tu correo electrónico.", "red");

            mostrarMensaje("Enviando enlace...", "blue");

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    mostrarMensaje("¡Correo enviado! Revisa tu bandeja de entrada.", "green");
                    document.getElementById('recuperar-email').value = "";
                })
                .catch((error) => {
                    mostrarMensaje("Error: " + traducirError(error.code), "red");
                });
        }

        function reenviarVerificacion(user) {
            user.sendEmailVerification()
                .then(() => mostrarMensaje("Correo de verificación reenviado.", "green"))
                .catch((error) => mostrarMensaje("Error al reenviar: " + error.message, "red"));
        }

        function mostrarMensaje(texto, color) {
            mensaje.innerText = texto;
            mensaje.style.color = color;
        }

        function traducirError(codigo) {
            switch(codigo) {
                case 'auth/user-not-found': return 'No existe una cuenta con este correo.';
                case 'auth/wrong-password': return 'Contraseña incorrecta.';
                case 'auth/invalid-credential': return 'Credenciales incorrectas.';
                case 'auth/email-already-in-use': return 'Este correo ya está registrado.';
                case 'auth/invalid-email': return 'El formato del correo no es válido.';
                case 'auth/weak-password': return 'La contraseña es demasiado débil.';
                case 'auth/too-many-requests': return 'Demasiados intentos. Espera un momento.';
                case 'permission-denied': return 'Error de permisos en la base de datos.';
                default: return 'Ocurrió un error. Verifica tus datos.';
            }
        }
    </script>
</body>
</html>
