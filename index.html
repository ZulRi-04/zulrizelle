<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso - Web App Global</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/css/intlTelInput.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/js/intlTelInput.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: #AED6F1; 
            display: flex; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            padding: 20px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 8px;
            padding: 10px 5px;
            gap: 12px;
        }

        .header-brand .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
        }

        .header-brand .brand-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.3px;
            line-height: 1.3;
        }
        .header-brand .brand-text span {
            color: #d4a017;
        }

        .zelle-logo {
            width: 100px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
        }

        .card { 
            background: white; 
            width: 100%; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            overflow: hidden;
        }

        .form-container {
            padding: 25px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .iti { width: 100%; }
        .iti__search-input {
            padding: 8px 35px 8px 12px !important;
            border: 1px solid #ddd !important;
            border-radius: 6px !important;
            font-size: 14px !important;
            margin: 8px !important;
            width: calc(100% - 16px) !important;
        }
        .iti__search-input:focus {
            outline: none;
            border-color: #007bff !important;
        }
        .iti__search-box {
            position: relative;
        }
        .iti__search-box::before {
            content: "🔍";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.5;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            transition: color 0.3s;
            z-index: 10;
            margin-top: 12px;
        }
        .toggle-password:hover { color: #007bff; }
        .toggle-password svg { width: 20px; height: 20px; }

        .row {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button.btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button.btn-primary:hover { background-color: #0056b3; }

        .btn-google {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-google:hover { background-color: #f8f9fa; border-color: #bbb; }
        .btn-google svg { width: 20px; height: 20px; }

        .link-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            width: 100%;
        }
        .link-btn:hover { color: #0056b3; }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .user-info img { width: 40px; height: 40px; border-radius: 50%; }
        .user-info .info-text { flex: 1; }
        .user-info .info-text .name { font-weight: 600; font-size: 14px; color: #333; }
        .user-info .info-text .email { font-size: 12px; color: #666; }

        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .hidden { display: none !important; }

        @media (min-width: 768px) {
            body { padding: 40px; }
            .header-brand .logo { width: 130px; height: 130px; }
            .header-brand .brand-text { font-size: 1.35rem; }
            .zelle-logo { width: 120px; }
            .form-container { padding: 30px; }
            .row { flex-direction: row; }
            .row .input-group { flex: 1; margin-bottom: 0; }
        }

        @media (max-width: 480px) {
            body { padding: 15px; }
            .header-brand .logo { width: 95px; height: 95px; }
            .header-brand .brand-text { font-size: 1.05rem; }
            .zelle-logo { width: 90px; }
            .header-brand { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        
        <div class="header-brand">
            <img src="logo.png" alt="ZulRi Logo" class="logo">
            <div class="brand-text">Bienvenido a tu <span>verificador de confianza</span></div>
            <img src="https://logowik.com/content/uploads/images/zelle7181.jpg" alt="Zelle" class="zelle-logo">
        </div>

        <div class="card">
            <div class="form-container">
                
                <div id="form-login">
                    <p class="subtitle">Inicia sesión para continuar</p>
                    
                    <div class="input-group">
                        <label>Correo electrónico</label>
                        <input type="email" id="login-email" placeholder="tu@correo.com">
                    </div>
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="login-password" placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <button class="btn-primary" onclick="iniciarSesion()">Entrar</button>
                    
                    <div style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px;">
                        <p class="subtitle" style="margin-bottom: 10px;">¿No tienes cuenta?</p>
                        <button class="btn-google" onclick="iniciarConGoogle()">
                            <svg viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Crear cuenta con Google
                        </button>
                    </div>
                </div>

                <div id="form-google-paso2" class="hidden">
                    <p class="subtitle">Tu correo ya está verificado. Solo necesitamos algunos datos más.</p>
                    
                    <div class="user-info">
                        <img id="google-avatar" src="" alt="Avatar">
                        <div class="info-text">
                            <div class="name" id="google-name">Usuario</div>
                            <div class="email" id="google-email">correo@gmail.com</div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="input-group">
                            <label>Nombre *</label>
                            <input type="text" id="g-nombre" placeholder="Tu nombre" required>
                        </div>
                        <div class="input-group">
                            <label>Apellido *</label>
                            <input type="text" id="g-apellido" placeholder="Tu apellido" required>
                        </div>
                    </div>

                    <!-- NUEVO CAMPO: ALIAS (OPCIONAL) -->
                    <div class="input-group">
                        <label>Alias (Opcional)</label>
                        <input type="text" id="g-alias" placeholder="Ej: JuanPerez99 (Se mostrará en tu perfil)">
                    </div>
                    
                    <div class="input-group" style="margin-top: 15px;">
                        <label>Número de teléfono *</label>
                        <input type="tel" id="telefono-input" placeholder="Selecciona tu país e ingresa el número" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Contraseña *</label>
                        <input type="password" id="g-password" placeholder="Mínimo 6 caracteres" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('g-password', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="input-group">
                        <label>Confirmar Contraseña *</label>
                        <input type="password" id="g-confirm" placeholder="Repite la contraseña" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('g-confirm', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    
                    <button class="btn-primary" onclick="completarRegistroGoogle()">Continuar</button>
                    <button class="link-btn" onclick="cancelarRegistroGoogle()">Cancelar y volver</button>
                </div>

                <p id="mensaje"></p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBveW42iYdCHka8Q_pFlHTR2E6ou7DTek0",
            authDomain: "zulri-1c741.firebaseapp.com",
            databaseURL: "https://zulri-1c741-default-rtdb.firebaseio.com",
            projectId: "zulri-1c741",
            storageBucket: "zulri-1c741.firebasestorage.app",
            messagingSenderId: "694828053364",
            appId: "1:694828053364:web:b617344a0cfaefc954f221"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const mensaje = document.getElementById('mensaje');
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        
        let usuarioGoogleTemporal = null;
        let telefonoInputInstance = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('usuarios/' + user.uid).once('value').then((snapshot) => {
                    const datos = snapshot.val();
                    if (datos && datos.nombre && datos.apellido && datos.telefono) {
                        window.location.href = "dashboard.html";
                    }
                });
            }
        });

        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const eyeOpen = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>`;
            const eyeClosed = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>`;

            if (input.type === "password") {
                input.type = "text";
                button.innerHTML = eyeClosed;
            } else {
                input.type = "password";
                button.innerHTML = eyeOpen;
            }
        }

        function iniciarConGoogle() {
            mostrarMensaje("Conectando con Google...", "blue");
            auth.signInWithPopup(googleProvider)
                .then((result) => {
                    const user = result.user;
                    return db.ref('usuarios/' + user.uid).once('value').then((snapshot) => {
                        const datos = snapshot.val();
                        if (datos && datos.nombre && datos.apellido && datos.telefono) {
                            mostrarMensaje("¡Bienvenido de nuevo! Redirigiendo...", "green");
                        } else {
                            usuarioGoogleTemporal = user;
                            mostrarPaso2Google(user);
                        }
                    });
                })
                .catch((error) => mostrarMensaje("Error: " + error.message, "red"));
        }

        function mostrarPaso2Google(user) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-google-paso2').classList.remove('hidden');
            document.getElementById('google-avatar').src = user.photoURL || 'https://via.placeholder.com/40';
            document.getElementById('google-name').textContent = user.displayName || 'Usuario de Google';
            document.getElementById('google-email').textContent = user.email;
            const nombreCompleto = user.displayName || "";
            const partes = nombreCompleto.split(' ');
            if (partes[0]) document.getElementById('g-nombre').value = partes[0];
            if (partes.length > 1) document.getElementById('g-apellido').value = partes.slice(1).join(' ');
            inicializarSelectorTelefono();
            mostrarMensaje("");
        }

        function inicializarSelectorTelefono() {
            if (telefonoInputInstance) telefonoInputInstance.destroy();
            const input = document.getElementById('telefono-input');
            telefonoInputInstance = window.intlTelInput(input, {
                initialCountry: "auto",
                geoIpLookup: function(callback) {
                    fetch("https://ipapi.co/json/")
                        .then(res => res.json())
                        .then(data => { if (data.country_code) callback(data.country_code); else throw new Error(); })
                        .catch(() => {
                            fetch("http://ip-api.com/json/")
                                .then(res => res.json())
                                .then(data => { if (data.countryCode) callback(data.countryCode); else throw new Error(); })
                                .catch(() => callback("es"));
                        });
                },
                utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/js/utils.js",
                separateDialCode: true,
                showSearchBox: true,
                searchBoxPlaceholder: "🔍 Buscar país o código...",
                preferredCountries: ["es", "mx", "ar", "co", "cl", "pe", "ve", "us", "do", "pr", "gt", "hn", "sv", "ni", "cr", "pa", "cu", "ec", "bo", "py", "uy"],
                autoPlaceholder: "polite",
                formatOnDisplay: true
            });
        }

        // Verificar si el teléfono ya existe
        async function telefonoExiste(telefono) {
            const snapshot = await db.ref('usuarios').orderByChild('telefono').equalTo(telefono).once('value');
            return snapshot.exists();
        }

        // Verificar si el alias ya existe (NUEVO)
        async function aliasExiste(alias) {
            if (!alias) return false;
            const snapshot = await db.ref('usuarios').orderByChild('alias').equalTo(alias).once('value');
            return snapshot.exists();
        }

        // Función asíncrona para manejar todas las validaciones en orden
        async function completarRegistroGoogle() {
            const nombre = document.getElementById('g-nombre').value.trim();
            const apellido = document.getElementById('g-apellido').value.trim();
            const alias = document.getElementById('g-alias').value.trim();
            const password = document.getElementById('g-password').value;
            const confirm = document.getElementById('g-confirm').value;

            // Validaciones obligatorias
            if (!nombre) return mostrarMensaje("El nombre es obligatorio.", "red");
            if (!apellido) return mostrarMensaje("El apellido es obligatorio.", "red");
            if (!telefonoInputInstance || !telefonoInputInstance.getNumber()) return mostrarMensaje("El número de teléfono es obligatorio.", "red");
            if (!telefonoInputInstance.isValidNumber()) return mostrarMensaje("Por favor, ingresa un número de teléfono válido.", "red");
            if (!password) return mostrarMensaje("La contraseña es obligatoria.", "red");
            if (password.length < 6) return mostrarMensaje("La contraseña debe tener al menos 6 caracteres.", "red");
            if (!confirm) return mostrarMensaje("Debes confirmar la contraseña.", "red");
            if (password !== confirm) return mostrarMensaje("Las contraseñas no coinciden.", "red");

            const telefonoCompleto = telefonoInputInstance.getNumber();
            const paisSeleccionado = telefonoInputInstance.getSelectedCountryData();

            try {
                mostrarMensaje("Verificando datos...", "blue");

                // 1. Verificar teléfono único
                if (await telefonoExiste(telefonoCompleto)) {
                    return mostrarMensaje("Este número de teléfono ya está registrado. Usa otro o inicia sesión.", "red");
                }

                // 2. Verificar alias único (solo si el usuario escribió uno)
                if (alias) {
                    if (await aliasExiste(alias)) {
                        return mostrarMensaje("Este alias ya está en uso. Por favor, elige otro.", "red");
                    }
                }

                // 3. Guardar datos en Firebase
                mostrarMensaje("Guardando datos...", "blue");
                const user = usuarioGoogleTemporal;

                await db.ref('usuarios/' + user.uid).set({
                    nombre,
                    apellido,
                    alias: alias || "", // Guarda vacío si no se proporcionó
                    email: user.email,
                    telefono: telefonoCompleto,
                    codigoPais: paisSeleccionado.iso2,
                    nombrePais: paisSeleccionado.name,
                    foto: user.photoURL || "",
                    fechaRegistro: new Date().toISOString(),
                    metodoRegistro: 'google',
                    correoVerificado: true
                });

                await user.updatePassword(password);
                await auth.signOut();

                usuarioGoogleTemporal = null;
                mostrarMensaje("¡Cuenta creada exitosamente! Ahora inicia sesión.", "green");

                // Limpiar campos
                document.getElementById('g-nombre').value = "";
                document.getElementById('g-apellido').value = "";
                document.getElementById('g-alias').value = "";
                document.getElementById('g-password').value = "";
                document.getElementById('g-confirm').value = "";
                if (telefonoInputInstance) telefonoInputInstance.setNumber("");

                setTimeout(() => {
                    document.getElementById('form-google-paso2').classList.add('hidden');
                    document.getElementById('form-login').classList.remove('hidden');
                    document.getElementById('login-email').value = user.email;
                    mostrarMensaje("");
                }, 2000);

            } catch (error) {
                mostrarMensaje("Error: " + error.message, "red");
            }
        }

        function cancelarRegistroGoogle() {
            if (usuarioGoogleTemporal) {
                auth.signOut().then(() => {
                    usuarioGoogleTemporal = null;
                    document.getElementById('form-google-paso2').classList.add('hidden');
                    document.getElementById('form-login').classList.remove('hidden');
                    mostrarMensaje("");
                });
            } else {
                document.getElementById('form-google-paso2').classList.add('hidden');
                document.getElementById('form-login').classList.remove('hidden');
                mostrarMensaje("");
            }
        }

        function iniciarSesion() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            mostrarMensaje("Procesando...", "blue");
            auth.signInWithEmailAndPassword(email, password)
                .then(() => mostrarMensaje("¡Inicio de sesión exitoso! Redirigiendo...", "green"))
                .catch((error) => mostrarMensaje("Error: " + traducirError(error.code), "red"));
        }

        function mostrarMensaje(texto, color) {
            mensaje.innerText = texto;
            mensaje.style.color = color || '#333';
        }

        function traducirError(codigo) {
            switch(codigo) {
                case 'auth/user-not-found': return 'No existe una cuenta con este correo.';
                case 'auth/wrong-password': return 'Contraseña incorrecta.';
                case 'auth/invalid-credential': return 'Credenciales incorrectas.';
                case 'auth/email-already-in-use': return 'Este correo ya está registrado.';
                case 'auth/invalid-email': return 'El formato del correo no es válido.';
                case 'auth/weak-password': return 'La contraseña es demasiado débil.';
                case 'auth/too-many-requests': return 'Demasiados intentos. Espera un momento.';
                case 'permission-denied': return 'Error de permisos en la base de datos.';
                case 'auth/requires-recent-login': return 'Por seguridad, cierra sesión e inicia de nuevo.';
                default: return 'Ocurrió un error. Verifica tus datos.';
            }
        }
    </script>
</body>
</html>
