<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zulri · Galería</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
        --fondo:#f7f8fa; --blanco:#ffffff; --texto:#1c1c1e; --suave:#8a8f98;
        --linea:#e6e8eb; --acento:#667eea; --peligro:#dc2626; --exito:#16a34a;
        --proceso:#f59e0b;
    }
    body { font-family:'Inter',sans-serif; background:var(--fondo); color:var(--texto); min-height:100vh; }
    [hidden] { display:none !important; }

    header { background:var(--blanco); border-bottom:1px solid var(--linea); padding:18px 32px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .logo { height:48px; width:auto; object-fit:contain; }
    .usuario-box { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    #user-email { font-size:.85rem; color:var(--suave); }
    .badge { font-size:.7rem; padding:5px 10px; border-radius:20px; background:#eef0ff; color:var(--acento); font-weight:600; }
    .salir { background:none; border:1px solid var(--linea); padding:8px 14px; border-radius:8px; font-size:.85rem; cursor:pointer; color:var(--texto); transition:.2s; }
    .salir:hover { background:var(--fondo); }

    main { max-width:1100px; margin:0 auto; padding:32px 24px 60px; }
    h1 { font-size:1.5rem; font-weight:600; letter-spacing:-.5px; margin-bottom:22px; }
    h2 { font-size:1.1rem; margin-bottom:16px; font-weight:600; }

    /* ===== SECCIÓN DE SUBIDA MEJORADA ===== */
    .seccion-subir { 
        background:var(--blanco); 
        border:1px solid var(--linea); 
        border-radius:16px; 
        padding:32px; 
        margin-bottom:40px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .seccion-subir h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
    }
    .seccion-subir h2::before {
        content: '📷';
        font-size: 1.3rem;
    }
    .ayuda { font-size:.85rem; color:var(--suave); margin-bottom:24px; line-height:1.6; }
    
    .zona { 
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap: 12px;
        border:2px dashed var(--linea); 
        border-radius:12px; 
        padding:48px 24px; 
        text-align:center; 
        cursor:pointer; 
        transition:.3s; 
        font-size:.95rem; 
        color:var(--suave);
        margin-bottom: 20px;
    }
    .zona:hover { 
        border-color:var(--acento); 
        color:var(--acento); 
        background:#fafaff;
        transform: translateY(-2px);
    }
    .zona-icon {
        font-size: 3rem;
        opacity: 0.5;
    }
    .zona-text {
        font-weight: 500;
    }
    .zona-hint {
        font-size: 0.8rem;
        opacity: 0.7;
    }
    #archivo { display:none; }
    
    /* Campo de nombre de cuenta */
    .campo-cuenta {
        margin-bottom: 20px;
    }
    .campo-cuenta label {
        display: block;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--texto);
        margin-bottom: 8px;
    }
    .campo-cuenta input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--linea);
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        transition: all 0.2s;
    }
    .campo-cuenta input:focus {
        outline: none;
        border-color: var(--acento);
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .campo-cuenta input::placeholder {
        color: var(--suave);
    }
    
    progress { width:100%; height:8px; margin-top:16px; accent-color:var(--acento); border-radius: 4px; }
    .estado { font-size:.85rem; margin-top:12px; min-height:1.2em; color:var(--suave); font-weight: 500; }
    .estado.error { color:var(--peligro); }
    .estado.ok { color:var(--exito); }

    /* ===== PESTAÑAS ===== */
    .pestanas { display:flex; gap:8px; margin-bottom:22px; border-bottom:1px solid var(--linea); flex-wrap:wrap; }
    .pestana { padding:10px 18px; background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-size:.9rem; color:var(--suave); font-weight:500; transition:.2s; }
    .pestana:hover { color:var(--texto); }
    .pestana.activa { color:var(--acento); border-bottom-color:var(--acento); }
    .pestana .contador { display:inline-block; background:var(--fondo); padding:2px 8px; border-radius:10px; font-size:.75rem; margin-left:6px; }
    .pestana .contador.alerta { background:#fef3c7; color:#92400e; }

    /* ===== GALERÍA ===== */
    .galeria { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px; }
    .tarjeta { background:var(--blanco); border:1px solid var(--linea); border-radius:12px; overflow:hidden; transition:transform .2s, box-shadow .2s; position:relative; }
    .tarjeta:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .tarjeta img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; cursor:zoom-in; }
    .pie { padding:14px; font-size:.8rem; color:var(--suave); display:flex; flex-direction:column; gap:8px; }
    .pie-fila { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .pie-nombre { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight: 500; color: var(--texto); }
    
    /* Nombre de cuenta remitente */
    .pie-cuenta {
        font-size: 0.75rem;
        color: var(--acento);
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .pie-cuenta::before {
        content: '👤';
        font-size: 0.8rem;
    }

    .estado-badge { font-size:.7rem; padding:4px 10px; border-radius:12px; font-weight:600; white-space:nowrap; }
    .badge-aprobada { background:#dcfce7; color:#166534; }
    .badge-proceso { background:#fef3c7; color:#92400e; animation: pulso 2s infinite; }
    .badge-denegada { background:#fee2e2; color:#991b1b; }

    @keyframes pulso {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }

    .vacio { padding:70px 20px; text-align:center; color:var(--suave); background:var(--blanco); border:1px dashed var(--linea); border-radius:12px; font-size:.95rem; }

    .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
    .lightbox img { max-width:94vw; max-height:86vh; object-fit:contain; border-radius:6px; }
    .cerrar { position:absolute; top:20px; right:26px; background:none; border:none; color:white; font-size:2rem; cursor:pointer; }

    @media(max-width:760px){
        header { padding:16px 20px; }
        .logo { height:40px; }
        main { padding:24px 16px 50px; }
        .galeria { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
        .seccion-subir { padding: 24px 20px; }
        .zona { padding: 36px 20px; }
    }
</style>
</head>
<body>

<header>
    <img src="logo.png" alt="Zulri Supermarket" class="logo">
    <div class="usuario-box">
        <span id="user-email">Cargando…</span>
        <span class="badge">Usuario</span>
        <button class="salir" id="salir-btn">Salir</button>
    </div>
</header>

<main>
    <!-- SECCIÓN DE SUBIDA MEJORADA -->
    <div class="seccion-subir">
        <h2>Subir foto</h2>
        <p class="ayuda">Sube una foto para que el administrador la revise. Una vez aprobada, será visible para todos los usuarios.</p>
        
        <label class="zona" for="archivo">
            <span class="zona-icon">📤</span>
            <span class="zona-text">Haz clic para seleccionar una imagen</span>
            <span class="zona-hint">JPG, PNG, GIF (máximo 32MB)</span>
        </label>
        <input type="file" id="archivo" accept="image/*">
        
        <div class="campo-cuenta">
            <label for="nombre-cuenta">Nombre de la cuenta remitente</label>
            <input type="text" id="nombre-cuenta" placeholder="Ej: María González, Tienda Central, etc." maxlength="50">
        </div>
        
        <progress id="progreso" value="0" max="100" hidden></progress>
        <div class="estado" id="estado-subida"></div>
    </div>

    <!-- PESTAÑAS -->
    <div class="pestanas">
        <button class="pestana activa" data-filtro="aprobadas">
            ✓ Aprobadas <span class="contador" id="cont-aprobadas">0</span>
        </button>
        <button class="pestana" data-filtro="pendientes">
            ⏳ Mis pendientes <span class="contador alerta" id="cont-pendientes">0</span>
        </button>
        <button class="pestana" data-filtro="denegadas">
            ✗ Mis denegadas <span class="contador" id="cont-denegadas">0</span>
        </button>
    </div>

    <div class="galeria" id="galeria"></div>
    <div class="vacio" id="vacio" hidden>No hay fotos para mostrar.</div>
</main>

<div class="lightbox" id="lightbox">
    <button class="cerrar" id="cerrar-lightbox" aria-label="Cerrar">×</button>
    <img id="lightbox-img" alt="Foto ampliada">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBveW42iYdCHka8Q_pFlHTR2E6ou7DTek0",
        authDomain: "zulri-1c741.firebaseapp.com",
        databaseURL: "https://zulri-1c741-default-rtdb.firebaseio.com",
        projectId: "zulri-1c741",
        storageBucket: "zulri-1c741.firebasestorage.app",
        messagingSenderId: "694828053364",
        appId: "1:694828053364:web:b617344a0cfaefc954f221"
    };

    const IMGBB_API_KEY = "05a3f5378c00a0a3a197b19c3343959e";

    const OPCIONES_COMPRESION = {
        maxSizeMB: 1,
        maxWidthOrHeight: 1280,
        useWebWorker: true,
        fileType: 'image/jpeg'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let usuarioActual = null;
    let filtroActual = 'aprobadas';
    let todasLasFotos = [];

    const galeria = document.getElementById('galeria');
    const vacio = document.getElementById('vacio');
    const archivo = document.getElementById('archivo');
    const progreso = document.getElementById('progreso');
    const estadoSubida = document.getElementById('estado-subida');
    const nombreCuentaInput = document.getElementById('nombre-cuenta');

    function estado(el, texto, tipo = "") {
        el.textContent = texto;
        el.className = 'estado ' + tipo;
    }

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "index.html";
            return;
        }
        
        usuarioActual = user;
        document.getElementById('user-email').textContent = user.email;
        cargarFotos();
    });

    function cargarFotos() {
        onValue(ref(db, 'fotos'), (snapshot) => {
            todasLasFotos = [];
            snapshot.forEach(child => {
                const data = child.val();
                if (!data.estado) data.estado = 'pendiente';
                todasLasFotos.push({ id: child.key, ...data });
            });
            todasLasFotos.sort((a, b) => (b.fecha || 0) - (a.fecha || 0));
            actualizarContadores();
            pintarGaleria();
        });
    }

    function actualizarContadores() {
        const aprobadas = todasLasFotos.filter(f => f.estado === 'aprobada').length;
        const misPendientes = todasLasFotos.filter(f => f.estado === 'pendiente' && f.subidoPor === usuarioActual.uid).length;
        const misDenegadas = todasLasFotos.filter(f => f.estado === 'denegada' && f.subidoPor === usuarioActual.uid).length;
        
        document.getElementById('cont-aprobadas').textContent = aprobadas;
        document.getElementById('cont-pendientes').textContent = misPendientes;
        document.getElementById('cont-denegadas').textContent = misDenegadas;
    }

    function pintarGaleria() {
        galeria.innerHTML = '';

        let fotosFiltradas;
        if (filtroActual === 'aprobadas') {
            fotosFiltradas = todasLasFotos.filter(f => f.estado === 'aprobada');
        } else if (filtroActual === 'pendientes') {
            fotosFiltradas = todasLasFotos.filter(f => f.estado === 'pendiente' && f.subidoPor === usuarioActual.uid);
        } else {
            fotosFiltradas = todasLasFotos.filter(f => f.estado === 'denegada' && f.subidoPor === usuarioActual.uid);
        }

        vacio.hidden = fotosFiltradas.length > 0;

        fotosFiltradas.forEach(foto => {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta';

            const img = document.createElement('img');
            img.src = foto.url;
            img.alt = foto.nombre || 'Foto';
            img.loading = 'lazy';
            img.addEventListener('click', () => abrirLightbox(foto.url));
            tarjeta.appendChild(img);

            const pie = document.createElement('div');
            pie.className = 'pie';

            const fila1 = document.createElement('div');
            fila1.className = 'pie-fila';
            const nombre = document.createElement('span');
            nombre.className = 'pie-nombre';
            nombre.textContent = foto.nombre || 'Foto';
            fila1.appendChild(nombre);
            pie.appendChild(fila1);

            // Mostrar nombre de cuenta remitente si existe
            if (foto.cuentaRemitente) {
                const cuenta = document.createElement('div');
                cuenta.className = 'pie-cuenta';
                cuenta.textContent = foto.cuentaRemitente;
                pie.appendChild(cuenta);
            }

            const fila2 = document.createElement('div');
            fila2.className = 'pie-fila';
            
            const fecha = document.createElement('span');
            fecha.style.fontSize = '.7rem';
            fecha.style.color = 'var(--suave)';
            fecha.textContent = new Date(foto.fecha).toLocaleDateString('es-ES');
            fila2.appendChild(fecha);

            const badge = document.createElement('span');
            badge.className = 'estado-badge';
            
            if (foto.estado === 'aprobada') {
                badge.className += ' badge-aprobada';
                badge.textContent = '✓ Aprobada';
            } else if (foto.estado === 'pendiente') {
                badge.className += ' badge-proceso';
                badge.textContent = '⏳ En proceso';
            } else if (foto.estado === 'denegada') {
                badge.className += ' badge-denegada';
                badge.textContent = '✗ Denegada';
            }
            
            fila2.appendChild(badge);
            pie.appendChild(fila2);

            tarjeta.appendChild(pie);
            galeria.appendChild(tarjeta);
        });
    }

    document.querySelectorAll('.pestana').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.pestana').forEach(b => b.classList.remove('activa'));
            btn.classList.add('activa');
            filtroActual = btn.dataset.filtro;
            pintarGaleria();
        });
    });

    archivo.addEventListener('change', async () => {
        const file = archivo.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            estado(estadoSubida, 'El archivo seleccionado no es una imagen.', 'error');
            return;
        }

        const nombreCuenta = nombreCuentaInput.value.trim();
        if (!nombreCuenta) {
            estado(estadoSubida, 'Por favor, ingresa el nombre de la cuenta remitente.', 'error');
            nombreCuentaInput.focus();
            return;
        }

        archivo.disabled = true;
        progreso.hidden = false;

        try {
            estado(estadoSubida, 'Comprimiendo imagen...');
            progreso.value = 20;
            const imagenComprimida = await imageCompression(file, OPCIONES_COMPRESION);

            estado(estadoSubida, 'Subiendo imagen...');
            progreso.value = 50;

            const formData = new FormData();
            formData.append('image', imagenComprimida);

            const response = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error?.message || 'Error al subir');
            }

            progreso.value = 90;

            await push(ref(db, 'fotos'), {
                url: data.data.url,
                nombre: file.name,
                cuentaRemitente: nombreCuenta, // ⭐ NUEVO CAMPO
                fecha: Date.now(),
                subidoPor: usuarioActual.uid,
                subidoPorNombre: usuarioActual.email.split('@')[0],
                imgbb_id: data.data.id,
                estado: 'pendiente'
            });

            estado(estadoSubida, '✅ Foto enviada. Esperando aprobación.', 'ok');
            nombreCuentaInput.value = ''; // Limpiar el campo
        } catch (error) {
            console.error(error);
            estado(estadoSubida, 'Error: ' + error.message, 'error');
        } finally {
            progreso.hidden = true;
            archivo.disabled = false;
            archivo.value = '';
        }
    });

    const lightbox = document.getElementById('lightbox');
    function abrirLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        lightbox.style.display = 'flex';
    }
    document.getElementById('cerrar-lightbox').addEventListener('click', () => lightbox.style.display = 'none');
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.style.display = 'none'; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.style.display = 'none'; });

    document.getElementById('salir-btn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = "index.html";
    });
</script>

</body>
</html>
