<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulri - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { min-height: 100vh; background: #f3f4f6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        h1 { color: #667eea; margin-bottom: 1rem; }
        .user-info { background: #f9fafb; padding: 1rem; border-radius: 8px; margin: 1.5rem 0; }
        .user-info p { color: #374151; margin: 0.3rem 0; }
        .user-info strong { color: #667eea; }
        button { padding: 0.75rem 1.5rem; background: #ef4444; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
        button:hover { background: #dc2626; }
        .welcome { font-size: 1.2rem; color: #1f2937; margin-bottom: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>👋 ¡Bienvenido a Zulri!</h1>
    
    <div class="user-info">
        <p>Has iniciado sesión como:</p>
        <p><strong id="user-email">...</strong></p>
        <p style="font-size: 0.85rem; color: #6b7280; margin-top: 0.5rem;">
            ID: <span id="user-uid">...</span>
        </p>
    </div>
    
    <p class="welcome">Tu cuenta está sincronizada en la nube.</p>
    
    <button id="logout-btn">Cerrar sesión</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBveW42iYdCHka8Q_pFlHTR2E6ou7DTek0",
        authDomain: "zulri-1c741.firebaseapp.com",
        databaseURL: "https://zulri-1c741-default-rtdb.firebaseio.com",
        projectId: "zulri-1c741",
        storageBucket: "zulri-1c741.firebasestorage.app",
        messagingSenderId: "694828053364",
        appId: "1:694828053364:web:b617344a0cfaefc954f221"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const userEmail = document.getElementById('user-email');
    const userUid = document.getElementById('user-uid');
    const logoutBtn = document.getElementById('logout-btn');

    // Verificar si el usuario está logueado
    onAuthStateChanged(auth, (user) => {
        if (user) {
            userEmail.textContent = user.email;
            userUid.textContent = user.uid;
        } else {
            // Si no está logueado, redirigir al login
            window.location.href = "index.html";
        }
    });

    // Cerrar sesión
    logoutBtn.addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = "index.html";
    });
</script>

</body>
</html>
