<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zulri Supermarket · Panel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
        --fondo:#f7f8fa;
        --blanco:#ffffff;
        --texto:#1c1c1e;
        --suave:#8a8f98;
        --linea:#e6e8eb;
        --acento:#667eea;
    }
    body {
        font-family:'Inter',sans-serif;
        background:var(--fondo);
        color:var(--texto);
        min-height:100vh;
    }
    [hidden] { display:none !important; }

    header {
        background:var(--blanco);
        border-bottom:1px solid var(--linea);
        padding:18px 32px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:16px;
        flex-wrap:wrap;
    }
    .logo { height:48px; width:auto; object-fit:contain; }
    .usuario-box { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    #user-email { font-size:.85rem; color:var(--suave); }
    .badge {
        font-size:.7rem;
        padding:5px 10px;
        border-radius:20px;
        background:#eef0ff;
        color:var(--acento);
        font-weight:600;
    }
    .salir {
        background:none;
        border:1px solid var(--linea);
        padding:8px 14px;
        border-radius:8px;
        font-size:.85rem;
        cursor:pointer;
        color:var(--texto);
        transition:.2s;
    }
    .salir:hover { background:var(--fondo); }

    main { max-width:1100px; margin:0 auto; padding:32px 24px 60px; }
    .titulo-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px; }
    h1 { font-size:1.5rem; font-weight:600; letter-spacing:-.5px; }
    #contador { font-size:.85rem; color:var(--suave); }

    .galeria {
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
        gap:20px;
    }
    .tarjeta {
        background:var(--blanco);
        border:1px solid var(--linea);
        border-radius:12px;
        overflow:hidden;
        position:relative;
        transition:transform .2s, box-shadow .2s;
    }
    .tarjeta:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .tarjeta img {
        width:100%;
        aspect-ratio:4/3;
        object-fit:cover;
        display:block;
        cursor:zoom-in;
    }
    .pie { padding:12px 14px; font-size:.8rem; color:var(--suave); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .eliminar {
        position:absolute;
        top:10px; right:10px;
        width:30px; height:30px;
        border:none;
        border-radius:50%;
        background:rgba(255,255,255,.95);
        color:#dc2626;
        font-size:1.1rem;
        cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.15);
    }
    .vacio {
        padding:70px 20px;
        text-align:center;
        color:var(--suave);
        background:var(--blanco);
        border:1px dashed var(--linea);
        border-radius:12px;
        font-size:.95rem;
    }

    .panel-admin {
        margin-top:40px;
        padding-top:30px;
        border-top:1px solid var(--linea);
    }
    .panel-admin h2 { font-size:1.1rem; margin-bottom:20px; font-weight:600; }
    .admin-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .caja {
        background:var(--blanco);
        border:1px solid var(--linea);
        border-radius:12px;
        padding:24px;
    }
    .caja h3 { font-size:.95rem; margin-bottom:6px; }
    .ayuda { font-size:.8rem; color:var(--suave); margin-bottom:18px; line-height:1.5; }
    .zona {
        display:block;
        border:2px dashed var(--linea);
        border-radius:10px;
        padding:30px 16px;
        text-align:center;
        cursor:pointer;
        transition:.2s;
        font-size:.9rem;
        color:var(--suave);
    }
    .zona:hover { border-color:var(--acento); color:var(--acento); background:#fafaff; }
    #archivo { display:none; }
    progress { width:100%; height:6px; margin-top:16px; accent-color:var(--acento); }
    .estado { font-size:.8rem; margin-top:12px; min-height:1.2em; color:var(--suave); }
    .estado.error { color:#dc2626; }
    .estado.ok { color:#16a34a; }

    label { display:block; font-size:.8rem; margin-bottom:6px; color:#374151; }
    input[type=text], input[type=password] {
        width:100%;
        padding:11px 12px;
        border:1px solid var(--linea);
        border-radius:8px;
        font-size:.9rem;
        margin-bottom:14px;
        outline:none;
        font-family:inherit;
    }
    input:focus { border-color:var(--acento); }
    .btn {
        width:100%;
        padding:11px;
        background:var(--acento);
        color:white;
        border:none;
        border-radius:8px;
        font-size:.9rem;
        font-weight:600;
        cursor:pointer;
        transition:.2s;
    }
    .btn:hover:not(:disabled) { background:#5568d3; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .lista { list-style:none; margin-top:16px; font-size:.82rem; color:var(--suave); }
    .lista li { padding:7px 0; border-top:1px solid var(--linea); }

    .lightbox {
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.92);
        display:none;
        align-items:center;
        justify-content:center;
        z-index:100;
        padding:20px;
    }
    .lightbox img { max-width:94vw; max-height:86vh; object-fit:contain; border-radius:6px; }
    .cerrar {
        position:absolute;
        top:20px; right:26px;
        background:none;
        border:none;
        color:white;
        font-size:2rem;
        cursor:pointer;
    }

    @media(max-width:760px){
        header { padding:16px 20px; }
        .logo { height:40px; }
        .admin-grid { grid-template-columns:1fr; }
        main { padding:24px 16px 50px; }
        .galeria { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    }
</style>
</head>
<body>

<header>
    <img src="logo.png" alt="Zulri Supermarket" class="logo">
    <div class="usuario-box">
        <span id="user-email">Cargando…</span>
        <span class="badge" id="badge-rol">—</span>
        <button class="salir" id="salir-btn">Salir</button>
    </div>
</header>

<main>
    <div class="titulo-row">
        <h1>Fotos</h1>
        <span id="contador"></span>
    </div>

    <div class="galeria" id="galeria"></div>
    <div class="vacio" id="vacio" hidden>Aún no hay fotos disponibles.</div>
    <div class="estado" id="estado-fotos"></div>

    <section class="panel-admin" id="admin-panel" hidden>
        <h2>Panel de administración</h2>

        <div class="admin-grid">
            <div class="caja">
                <h3>Subir fotos</h3>
                <p class="ayuda">Selecciona una o varias imágenes. Se publicarán automáticamente para todos los usuarios.</p>
                <label class="zona" for="archivo">
                    📷 Haz clic para elegir fotos
                </label>
                <input type="file" id="archivo" accept="image/*" multiple>
                <progress id="progreso" value="0" max="100" hidden></progress>
                <div class="estado" id="estado-subida"></div>
            </div>

            <div class="caja">
                <h3>Crear nuevo usuario</h3>
                <p class="ayuda">El nuevo usuario solo podrá ver las fotos. Compártele la contraseña de forma segura.</p>
                <form id="form-usuario">
                    <label for="nuevo-usuario">Nombre de usuario</label>
                    <input type="text" id="nuevo-usuario" placeholder="ej: ana" autocomplete="off" required>
                    <label for="nueva-clave">Contraseña temporal (mínimo 6 caracteres)</label>
                    <input type="password" id="nueva-clave" placeholder="Contraseña" autocomplete="new-password" required>
                    <button type="submit" class="btn" id="crear-btn">Crear usuario</button>
                </form>
                <div class="estado" id="estado-usuario"></div>
                <ul class="lista" id="lista-usuarios"></ul>
            </div>
        </div>
    </section>
</main>

<div class="lightbox" id="lightbox">
    <button class="cerrar" id="cerrar-lightbox" aria-label="Cerrar">×</button>
    <img id="lightbox-img" alt="Foto ampliada">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getAuth, onAuthStateChanged, signOut,
        initializeAuth, createUserWithEmailAndPassword, inMemoryPersistence
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
        getDatabase, ref, onValue, push, set, remove
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBveW42iYdCHka8Q_pFlHTR2E6ou7DTek0",
        authDomain: "zulri-1c741.firebaseapp.com",
        databaseURL: "https://zulri-1c741-default-rtdb.firebaseio.com",
        projectId: "zulri-1c741",
        storageBucket: "zulri-1c741.firebasestorage.app",
        messagingSenderId: "694828053364",
        appId: "1:694828053364:web:b617344a0cfaefc954f221"
    };

    // ✅ TU CLAVE API DE IMGBB YA ESTÁ INTEGRADA AQUÍ
    const IMGBB_API_KEY = "05a3f5378c00a0a3a197b19c3343959e";
    const ADMIN_EMAIL = "richard@zulri.local";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const creador = initializeAuth(app, {
        name: "creador",
        persistence: inMemoryPersistence
    });

    let usuarioActual = null;
    let esAdmin = false;

    const galeria = document.getElementById('galeria');
    const vacio = document.getElementById('vacio');
    const contador = document.getElementById('contador');
    const adminPanel = document.getElementById('admin-panel');
    const archivo = document.getElementById('archivo');
    const progreso = document.getElementById('progreso');
    const estadoSubida = document.getElementById('estado-subida');
    const estadoUsuario = document.getElementById('estado-usuario');
    const crearBtn = document.getElementById('crear-btn');

    function estado(el, texto, tipo = "") {
        el.textContent = texto;
        el.className = 'estado ' + tipo;
    }

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "index.html";
            return;
        }
        usuarioActual = user;
        esAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

        document.getElementById('user-email').textContent = user.email;
        document.getElementById('badge-rol').textContent = esAdmin ? 'Administrador' : 'Solo lectura';
        adminPanel.hidden = !esAdmin;

        cargarFotos();
        if (esAdmin) cargarUsuarios();
    });

    function cargarFotos() {
        onValue(ref(db, 'fotos'), (snapshot) => {
            const fotos = [];
            snapshot.forEach(child => fotos.push({ id: child.key, ...child.val() }));
            fotos.sort((a, b) => (b.fecha || 0) - (a.fecha || 0));
            pintarGaleria(fotos);
        }, (error) => {
            estado(document.getElementById('estado-fotos'), 'No se pudieron cargar las fotos. (' + error.code + ')', 'error');
        });
    }

    function pintarGaleria(fotos) {
        galeria.innerHTML = '';
        contador.textContent = fotos.length + (fotos.length === 1 ? ' foto' : ' fotos');
        vacio.hidden = fotos.length > 0;

        fotos.forEach(foto => {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta';

            const img = document.createElement('img');
            img.src = foto.url;
            img.alt = foto.nombre || 'Foto';
            img.loading = 'lazy';
            img.addEventListener('click', () => abrirLightbox(foto.url));

            tarjeta.appendChild(img);

            if (esAdmin) {
                const btn = document.createElement('button');
                btn.className = 'eliminar';
                btn.textContent = '×';
                btn.title = 'Eliminar foto';
                btn.addEventListener('click', () => eliminarFoto(foto));
                tarjeta.appendChild(btn);
            }

            const pie = document.createElement('div');
            pie.className = 'pie';
            pie.textContent = foto.nombre || 'Foto';
            tarjeta.appendChild(pie);

            galeria.appendChild(tarjeta);
        });
    }

    archivo.addEventListener('change', async () => {
        if (!esAdmin) return;
        const archivos = Array.from(archivo.files);
        if (!archivos.length) return;

        archivo.disabled = true;
        progreso.hidden = false;

        for (let i = 0; i < archivos.length; i++) {
            const file = archivos[i];

            if (!file.type.startsWith('image/')) {
                estado(estadoSubida, 'El archivo "' + file.name + '" no es una imagen.', 'error');
                continue;
            }
            if (file.size > 32 * 1024 * 1024) {
                estado(estadoSubida, 'La imagen "' + file.name + '" supera los 32 MB.', 'error');
                continue;
            }

            try {
                estado(estadoSubida, 'Subiendo foto ' + (i + 1) + ' de ' + archivos.length + '...');
                progreso.value = 50;

                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error?.message || 'Error al subir');
                }

                progreso.value = 100;

                await push(ref(db, 'fotos'), {
                    url: data.data.url,
                    nombre: file.name,
                    fecha: Date.now(),
                    subidoPor: usuarioActual.uid,
                    imgbb_id: data.data.id
                });

                estado(estadoSubida, '✅ Foto publicada correctamente.', 'ok');
            } catch (error) {
                console.error(error);
                estado(estadoSubida, 'Error al subir: ' + error.message, 'error');
            }
        }

        progreso.hidden = true;
        archivo.disabled = false;
        archivo.value = '';
    });

    async function eliminarFoto(foto) {
        if (!esAdmin) return;
        if (!confirm('¿Eliminar esta foto? Los usuarios dejarán de verla.')) return;

        try {
            await remove(ref(db, 'fotos/' + foto.id));
        } catch (error) {
            estado(document.getElementById('estado-fotos'), 'No se pudo eliminar: ' + error.message, 'error');
        }
    }

    document.getElementById('form-usuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!esAdmin) return;

        const nombre = document.getElementById('nuevo-usuario').value.trim();
        const clave = document.getElementById('nueva-clave').value;

        if (!/^[a-zA-Z0-9_-]{3,20}$/.test(nombre)) {
            estado(estadoUsuario, 'Usa entre 3 y 20 letras, números, guiones o guiones bajos.', 'error');
            return;
        }
        if (clave.length < 6) {
            estado(estadoUsuario, 'La contraseña debe tener al menos 6 caracteres.', 'error');
            return;
        }

        crearBtn.disabled = true;
        estado(estadoUsuario, 'Creando usuario…');

        try {
            const credencial = await createUserWithEmailAndPassword(
                creador,
                nombre.toLowerCase() + '@zulri.local',
                clave
            );

            await set(ref(db, 'usuarios/' + credencial.user.uid), {
                nombre: nombre,
                rol: 'lector',
                creado: Date.now()
            });

            estado(estadoUsuario, '✅ Usuario "' + nombre + '" creado. Compártele su contraseña.', 'ok');
            document.getElementById('form-usuario').reset();
        } catch (error) {
            const msg = error.code === 'auth/email-already-in-use'
                ? 'Ese nombre de usuario ya existe. Elige otro.'
                : 'No se pudo crear: ' + error.code;
            estado(estadoUsuario, msg, 'error');
        } finally {
            crearBtn.disabled = false;
        }
    });

    function cargarUsuarios() {
        onValue(ref(db, 'usuarios'), (snapshot) => {
            const lista = document.getElementById('lista-usuarios');
            lista.innerHTML = '';
            snapshot.forEach(child => {
                const dato = child.val();
                const li = document.createElement('li');
                li.textContent = '👤 ' + (dato.nombre || 'Usuario') + ' · solo lectura';
                lista.appendChild(li);
            });
        });
    }

    const lightbox = document.getElementById('lightbox');
    function abrirLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        lightbox.style.display = 'flex';
    }
    document.getElementById('cerrar-lightbox').addEventListener('click', () => lightbox.style.display = 'none');
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.style.display = 'none'; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.style.display = 'none'; });

    document.getElementById('salir-btn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = "index.html";
    });
</script>

</body>
</html>
